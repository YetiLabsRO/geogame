<nav class="navbar navbar-expand-sm bg-body-tertiary border-bottom">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold" routerLink="/">Cercetador staff</a>
    @if (isAuthenticated() && isStaff()) {
      <ul class="navbar-nav flex-row gap-3 me-auto ms-3 small">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            Review queue
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/invites" routerLinkActive="active">
            Invites
          </a>
        </li>
      </ul>
    }
    <div class="ms-auto d-flex align-items-center gap-2">
      @if (isAuthenticated()) {
        @if (username(); as name) {
          <span class="text-body-secondary small">{{ name }}</span>
        }
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="logout()">
          Sign out
        </button>
      } @else {
        <a class="btn btn-sm btn-outline-primary" routerLink="/login">Sign in</a>
      }
    </div>
  </div>
</nav>

<main class="container py-4">
  <router-outlet />
</main>
