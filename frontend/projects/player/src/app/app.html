@if (!isChromeless()) {
  <ui-top-app-bar [title]="sessionTitle()" [back]="!isTabRoot()" (backPressed)="goBack()">
    @if (isAuthenticated()) {
      <div appBarActions class="app-bar-actions">
        <a class="app-bar-actions__icon" routerLink="/settings" aria-label="Notification settings">
          <ui-icon name="bell" [size]="22" />
        </a>
        <a class="app-bar-actions__avatar" routerLink="/ledger" aria-label="Your ledger">
          <ui-avatar [size]="32" [name]="username()" />
        </a>
      </div>
    }
  </ui-top-app-bar>
}

<main class="tr-main" [class.tr-main--with-nav]="showNav()" [class.tr-main--flush]="isMapRoute()">
  <router-outlet />
</main>

@if (showNav()) {
  <ui-bottom-nav [items]="navItems" />
}

<ui-toast-outlet />
