<nav class="navbar navbar-expand-sm bg-body-tertiary border-bottom">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold" routerLink="/">Cercetador</a>
    <a class="nav-link small" routerLink="/trail">Trail</a>
    <a class="nav-link small" routerLink="/rules">Rules</a>
    @if (isAuthenticated()) {
      <a class="nav-link small" routerLink="/team">Team</a>
      <a class="nav-link small" routerLink="/history">History</a>
      <a class="nav-link small" routerLink="/teams">Teams</a>
      <a class="nav-link small" routerLink="/settings" title="Notification settings">
        <i class="bi bi-bell"></i>
      </a>
      @if (captainTeamId(); as teamId) {
        <a class="nav-link small" [routerLink]="['/team', teamId, 'requests']">My team</a>
      }
    }
    <div class="ms-auto d-flex align-items-center gap-2">
      @if (isAuthenticated()) {
        @if (username(); as name) {
          <span class="text-body-secondary small">{{ name }}</span>
        }
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="logout()">
          Sign out
        </button>
      } @else {
        <a class="btn btn-sm btn-outline-primary" routerLink="/login">Sign in</a>
      }
    </div>
  </div>
</nav>

<main class="container-fluid py-3">
  <router-outlet />
</main>
