<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deschide în aplicație</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; display: flex; min-height: 100vh;
           align-items: center; justify-content: center; background: #f8f9fa; color: #212529; }
    .card { background: #fff; border-radius: .75rem; padding: 2rem; max-width: 24rem;
            box-shadow: 0 .25rem .75rem rgba(0,0,0,.1); text-align: center; }
    .btn { display: inline-block; margin-top: 1rem; padding: .6rem 1.4rem; border-radius: .5rem;
           background: #0d6efd; color: #fff; text-decoration: none; font-weight: 600; }
    p.muted { color: #6c757d; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Scanează din aplicație</h1>
    <p>Acest tag face parte din joc și poate fi folosit doar din aplicația
       Cercetador, de la locul unde este ascuns.</p>
    <p class="muted">Linkul nu poate fi trimis mai departe — deschis în browser
       nu face nimic.</p>
    <a class="btn" href="{{ deep_link }}">Deschide aplicația</a>
    <p class="muted">Nu ai aplicația? Cere echipei tale linkul de instalare.</p>
  </div>
</body>
</html>
