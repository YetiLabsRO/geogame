; Gateway relay firmware — ESP32 (any WiFi-capable variant; a plain
; ESP32 devkit has more RAM headroom than the C3 for batching).
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor -b 115200
;
; Configure WiFi credentials + backend URL + the per-gateway token in
; include/config.h (token comes from POST /api/staff/gateways/).
;
; NOTE: this scaffold has not been compiled in this repository (no
; PlatformIO toolchain in the dev environment); expect minor API-level
; fixes on the first real build. See ../README.md.

[env:gateway]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I ../common
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
