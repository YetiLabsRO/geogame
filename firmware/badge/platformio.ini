; Wearable badge firmware — ESP32-C3 (wearable-badge-hardware).
;
; Build:   pio run
; Flash:   pio run -t upload            (USB-CDC on the C3's native USB)
; Monitor: pio device monitor -b 115200
;
; NOTE: this scaffold has not been compiled in this repository (no
; PlatformIO toolchain in the dev environment); expect minor API-level
; fixes on the first real build. See ../README.md.

[env:badge]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -I ../common
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    fastled/FastLED@^3.6.0
    ; IMU driver — pick to match the BOM part (MPU-6050 class 6-axis):
    electroniccats/MPU6050@^1.0.0
